<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papercrafts - GHOSTPER</title>
    <meta name="description" content="Browse all free anime papercraft templates. Search by character or series and filter by difficulty.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="list">
    <a class="skip" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main">
        <section class="page-head">
            <div class="wrap">
                <h1>Papercrafts</h1>
                <p>Search by character or series, and pick a difficulty that fits your skills.</p>
            </div>
        </section>

        <div class="wrap">
            <!-- Search, filter and sort -->
            <div class="toolbar">
                <div class="toolbar__row">
                    <label class="visually-hidden" for="q">Search papercrafts</label>
                    <input class="field" id="q" type="search" placeholder="Search character or anime" autocomplete="off">

                    <label class="visually-hidden" for="anime">Series</label>
                    <select class="field" id="anime">
                        <option value="all">All series</option>
                    </select>

                    <label class="visually-hidden" for="sort">Sort by</label>
                    <select class="field" id="sort">
                        <option value="new">Newest</option>
                        <option value="az">Name A-Z</option>
                        <option value="easy">Easiest first</option>
                        <option value="hard">Hardest first</option>
                    </select>
                </div>

                <div class="toolbar__row">
                    <div class="chips" id="diffChips" role="group" aria-label="Difficulty">
                        <button class="chip" type="button" data-d="all" aria-pressed="true">All</button>
                        <button class="chip" type="button" data-d="easy" aria-pressed="false">Easy</button>
                        <button class="chip" type="button" data-d="medium" aria-pressed="false">Medium</button>
                        <button class="chip" type="button" data-d="hard" aria-pressed="false">Hard</button>
                    </div>
                    <p class="result-count" id="count" role="status" aria-live="polite"></p>
                </div>
            </div>

            <!-- Ad: list page. Buraya reklam kodunu yapıştır. -->
            <aside class="ad" id="ad-list" aria-label="Advertisement" style="margin-bottom:1.5rem">
                <span>Advertisement</span>
                <!-- AD CODE HERE -->
            </aside>

            <div class="grid" id="grid"></div>

            <div class="empty" id="empty" hidden>
                <h2>No templates match your search</h2>
                <p>Try a different name, or clear the filters to see everything.</p>
                <button class="btn btn--primary" type="button" id="reset">Clear filters</button>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>
    <script src="script.js"></script>
</body>
</html>
